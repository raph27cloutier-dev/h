<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Home</title>
    <link rel="stylesheet" href="styles.css?v=11" />
  </head>
  <body data-screen="home">
    <div class="hero" aria-hidden="true">
      <div class="hero-layer is-visible">
        <div class="hero-text">
          <div class="hero-title"></div>
          <div class="hero-subtitle"></div>
        </div>
      </div>
      <div class="hero-layer">
        <div class="hero-text">
          <div class="hero-title"></div>
          <div class="hero-subtitle"></div>
        </div>
      </div>
      <div class="hero-fade"></div>
    </div>

    <div id="status" class="status"></div>

    <header class="topbar">
      <div id="greeting" class="greeting"></div>
      <div class="clock">
        <div id="clock-time" class="clock-time"></div>
        <div id="clock-date" class="clock-date"></div>
      </div>
    </header>

    <main>
      <section class="screen is-active" data-screen="home">
        <div id="home-rows" class="rows"></div>
      </section>

      <section class="screen" data-screen="all">
        <h1 class="screen-title">All Apps</h1>
        <div id="all-grid" class="grid grid-scroll"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script src="config.js?v=11"></script>
    <script src="nav.js?v=11"></script>
    <script src="apps.js?v=11"></script>
    <script src="remote.js?v=11"></script>
    <script src="tv.js?v=11"></script>
    <script src="view.js?v=11"></script>
    <script src="main.js?v=11"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Home</title>
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <div class="wallpaper"></div>

    <div id="status" class="status"></div>

    <header class="topbar">
      <div class="clock">
        <div id="clock-time" class="clock-time"></div>
        <div id="clock-date" class="clock-date"></div>
      </div>
    </header>

    <main>
      <section class="screen is-active" data-screen="home">
        <div id="home-grid" class="grid"></div>
      </section>

      <section class="screen" data-screen="all">
        <h1 class="screen-title">All Apps</h1>
        <div id="all-grid" class="grid grid-scroll"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script src="config.js?v=5"></script>
    <script src="nav.js?v=5"></script>
    <script src="apps.js?v=5"></script>
    <script src="tv.js?v=5"></script>
    <script src="view.js?v=5"></script>
    <script src="main.js?v=5"></script>
  </body>
</html>
